<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hệ Thống Bảo Hộ Số - Bản Quyền Hình Ảnh</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-app: #0b0f17;
            --bg-card: #121824;
            --bg-input: #1a2233;
            --accent-green: #a3e635;
            --text-main: #f3f4f6;
            --text-sec: #9ca3af;
            --border-sub: rgba(255, 255, 255, 0.08);
        }

        body {
            margin: 0; background: var(--bg-app); color: var(--text-main);
            font-family: 'Inter', sans-serif; min-height: 100vh; display: flex; flex-direction: column;
            padding: 40px 60px; box-sizing: border-box;
        }

        .header-section {
            max-width: 800px;
            margin-bottom: 40px;
        }

        .system-tag {
            font-size: 13px; color: var(--text-sec); letter-spacing: 1px; text-transform: uppercase;
            display: flex; align-items: center; gap: 10px; margin-bottom: 12px; font-weight: 600;
        }
        .system-tag::before {
            content: ""; display: inline-block; width: 24px; height: 1px; background: var(--text-sec);
        }

        h1 {
            font-size: 42px; font-weight: 700; margin: 0 0 16px 0; letter-spacing: -1px;
            background: linear-gradient(180deg, #ffffff 0%, #9ca3af 100%);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }
        h1 span {
            color: var(--accent-green); -webkit-text-fill-color: var(--accent-green);
        }

        .desc {
            font-size: 15px; color: var(--text-sec); line-height: 1.6; margin: 0;
        }

        /* Layout 2 Cột */
        .workspace {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 24px;
            width: 100%;
            max-width: 1200px;
        }

        .card {
            background: var(--bg-card);
            border: 1px solid var(--border-sub);
            border-radius: 16px;
            padding: 32px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.4);
        }

        .step-indicator {
            font-size: 12px; font-weight: 600; color: var(--text-sec); text-transform: uppercase; letter-spacing: 0.5px;
        }

        .card-title {
            font-size: 20px; font-weight: 600; margin: 0; color: #fff;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .form-label {
            font-size: 13px; font-weight: 500; color: var(--text-sec);
        }

        .form-input {
            background: var(--bg-input);
            border: 1px solid var(--border-sub);
            border-radius: 10px;
            padding: 14px 16px;
            color: #fff;
            font-size: 14px;
            outline: none;
            transition: 0.2s;
        }
        .form-input:focus {
            border-color: var(--accent-green);
            box-shadow: 0 0 0 3px rgba(163, 230, 53, 0.15);
        }
        .form-input::placeholder { color: #4b5563; }

        /* Khung kéo thả file (Dropzone) */
        .dropzone {
            border: 2px dashed var(--border-sub);
            background: rgba(26, 34, 51, 0.4);
            border-radius: 12px;
            padding: 30px 20px;
            text-align: center;
            cursor: pointer;
            transition: 0.2s;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 10px;
            position: relative;
            overflow: hidden;
            min-height: 140px;
        }
        .dropzone:hover {
            border-color: var(--accent-green);
            background: rgba(163, 230, 53, 0.03);
        }

        .upload-icon {
            width: 32px; height: 32px; fill: var(--text-sec);
        }

        .dropzone-text {
            font-size: 13px; color: var(--text-sec); margin: 0;
        }
        .dropzone-text b { color: #fff; }

        /* Ảnh preview sau khi chọn */
        .preview-img {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            object-fit: cover;
            display: none;
            border-radius: 10px;
        }

        /* Nút bấm hành động */
        .btn-action {
            background: var(--accent-green);
            color: #0b0f17;
            border: none;
            border-radius: 10px;
            padding: 16px;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.2s;
            margin-top: auto;
            text-align: center;
        }
        .btn-action:hover {
            background: #84cc16;
            transform: translateY(-1px);
        }

        input[type="file"] { display: none; }
    </style>
</head>
<body>

    <div class="header-section">
        <div class="system-tag">Hệ thống bảo hộ số</div>
        <h1>Bản Quyền<br><span>Hình Ảnh</span></h1>
        <p class="desc">Xác thực quyền tác giả dựa trên giải thuật & siêu dữ liệu. Mỗi bức ảnh được định danh bằng dấu vân tay số duy nhất.</p>
    </div>

    <div class="workspace">
        <!-- Cột 01: Đăng ký bản quyền -->
        <div class="card">
            <span class="step-indicator">01 – Khởi tạo</span>
            <h2 class="card-title">Đăng ký bản quyền</h2>
            
            <div class="form-group">
                <label class="form-label">Chủ sở hữu</label>
                <input type="text" class="form-input" placeholder="Tên cá nhân hoặc tổ chức">
            </div>

            <div class="form-group">
                <label class="form-label">Tệp gốc</label>
                <label class="dropzone" id="dropzone1">
                    <svg class="upload-icon" id="icon1" viewBox="0 0 24 24"><path d="M19.35 10.04C18.67 6.59 15.64 4 12 4 9.11 4 6.6 5.64 5.35 8.04 2.34 8.36 0 10.91 0 14c0 3.31 2.69 6 6 6h13c2.76 0 5-2.24 5-5 0-2.64-2.05-4.78-4.65-4.96zM14 13v4h-4v-4H7l5-5 5 5h-3z"/></svg>
                    <p class="dropzone-text" id="text1">Chọn hoặc kéo ảnh gốc vào đây</p>
                    <img id="preview1" class="preview-img" alt="Preview">
                    <input type="file" id="file1" accept="image/*" onchange="previewImage(event, 1)">
                </label>
            </div>

            <button class="btn-action" type="button" onclick="alert('Đã gửi yêu cầu đăng ký bản quyền!')">Xác thực & Tạo dấu vân tay số</button>
        </div>

        <!-- Cột 02: Kiểm tra vi phạm -->
        <div class="card">
            <span class="step-indicator">02 – Thẩm định</span>
            <h2 class="card-title">Kiểm tra vi phạm</h2>

            <div class="form-group" style="flex: 1; display: flex; flex-direction: column;">
                <label class="form-label">Ảnh cần kiểm tra</label>
                <label class="dropzone" id="dropzone2" style="flex: 1;">
                    <svg class="upload-icon" id="icon2" viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-6h2v6zm0-8h-2V7h2v2z"/></svg>
                    <p class="dropzone-text" id="text2">Chọn hoặc kéo ảnh cần kiểm tra</p>
                    <img id="preview2" class="preview-img" alt="Preview">
                    <input type="file" id="file2" accept="image/*" onchange="previewImage(event, 2)">
                </label>
            </div>

            <button class="btn-action" type="button" onclick="alert('Đang tiến hành quét hệ thống tìm kiếm vi phạm...')">Bắt đầu quét hệ thống</button>
        </div>
    </div>

    <script>
        function previewImage(event, id) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    const preview = document.getElementById('preview' + id);
                    const icon = document.getElementById('icon' + id);
                    const text = document.getElementById('text' + id);

                    preview.src = e.target.result;
                    preview.style.display = 'block';
                    icon.style.display = 'none';
                    text.innerText = file.name; // Hiển thị tên file thay cho chữ hướng dẫn
                    text.style.color = 'var(--accent-green)';
                    text.style.zIndex = '2';
                    text.style.background = 'rgba(11, 15, 23, 0.7)';
                    text.style.padding = '4px 8px';
                    text.style.borderRadius = '4px';
                }
                reader.readAsDataURL(file);
            }
        }
    </script>
</body>
</html>
