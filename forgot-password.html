<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AUDIO POOL PRO - Quên Mật Khẩu</title>
    <script src="https://www.google.com/recaptcha/api.js" async defer></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-app: #090d16; --bg-sidebar: #111827; --accent-purple: #8b5cf6; --text-main: #f3f4f6; --text-sec: #9ca3af; --border-sub: rgba(255, 255, 255, 0.08);
        }
        body { margin: 0; background: var(--bg-app); color: var(--text-main); font-family: 'Inter', sans-serif; height: 100vh; display: flex; justify-content: center; align-items: center; }
        .auth-box { background: var(--bg-sidebar); border: 1px solid var(--border-sub); border-radius: 16px; padding: 30px 40px; width: 440px; display: flex; flex-direction: column; gap: 12px; box-shadow: 0 20px 50px rgba(0,0,0,0.8); }
        .auth-logo { font-size: 22px; font-weight: 700; color: var(--accent-purple); text-align: center; }
        .auth-field { display: flex; flex-direction: column; gap: 4px; font-size: 11px; color: var(--text-sec); font-weight: 600; text-transform: uppercase; }
        .input-wrapper { position: relative; display: flex; align-items: center; }
        .auth-field input { width: 100%; background: #090d16 !important; border: 1px solid var(--border-sub); border-radius: 8px; padding: 10px 36px 10px 12px; color: #fff !important; font-size: 13px; outline: none; -webkit-text-fill-color: #fff !important; }
        .auth-field input:focus { border-color: var(--accent-purple); }
        .toggle-eye { position: absolute; right: 10px; background: none; border: none; cursor: pointer; color: var(--text-sec); font-size: 14px; padding: 4px; }
        .otp-row { display: flex; gap: 8px; align-items: flex-end; }
        .otp-row .auth-field { flex: 1; }
        .timer-btn { background: #374151; color: #fff; border: none; border-radius: 8px; padding: 10px 12px; font-size: 12px; font-weight: 600; cursor: pointer; height: 39px; white-space: nowrap; }
        .timer-btn:disabled { background: #1f2937; color: #6b7280; cursor: not-allowed; }
        .auth-submit-btn { background: #10b981; color: #fff; border: none; border-radius: 8px; padding: 12px; font-weight: 700; font-size: 14px; cursor: pointer; transition: 0.2s; margin-top: 5px; }
        .auth-submit-btn:hover { background: #059669; }
        .auth-link { font-size: 13px; text-align: center; color: var(--text-sec); cursor: pointer; }
        .auth-link span { color: var(--accent-purple); font-weight: 600; text-decoration: underline; }
    </style>
</head>
<body>
    <div class="auth-box">
        <div class="auth-logo">🎧 AUDIO POOL PRO</div>
        <div style="font-size: 15px; font-weight: 600; text-align: center; color: #fff;">Khôi Phục Mật Khẩu</div>

        <div class="auth-field">
            <span>Email đăng ký</span>
            <div class="input-wrapper"><input type="email" id="resetEmail" placeholder="name@example.com" autocomplete="off"></div>
        </div>

        <div class="otp-row">
            <div class="auth-field">
                <span>Mã OTP (6 số)</span>
                <div class="input-wrapper"><input type="text" id="resetOtp" placeholder="123456" autocomplete="off"></div>
            </div>
            <button class="timer-btn" id="sendOtpBtn" type="button" onclick="requestOtp()">Gửi OTP</button>
        </div>

        <div class="auth-field">
            <span>Mật khẩu mới</span>
            <div class="input-wrapper">
                <input type="password" id="newPass" placeholder="••••••••" autocomplete="new-password">
                <button type="button" class="toggle-eye" onclick="togglePassword('newPass', this)">👁️</button>
            </div>
        </div>

        <!-- Google reCAPTCHA widget -->
        <div class="g-recaptcha" data-sitekey="6Lflpn8tAAAAALzyS5oBP_4qbht1TSV1NqAz6akF"></div>

        <button class="auth-submit-btn" type="button" onclick="handleResetPassword()">Xác Nhận Đổi Mật Khẩu</button>
        <div class="auth-link" onclick="window.location.href='login.html'">Quay lại <span>Đăng nhập</span></div>
    </div>

    <script>
        function togglePassword(fieldId, btn) {
            const input = document.getElementById(fieldId);
            if (input.type === "password") { input.type = "text"; btn.innerText = "🙈"; } 
            else { input.type = "password"; btn.innerText = "👁️"; }
        }

        let countdown = 60, timerInterval = null;

        async function requestOtp() {
            const email = document.getElementById('resetEmail').value.trim(); // Sửa đúng id="resetEmail"
            if (!email) { alert("Vui lòng nhập email trước!"); return; }

            const btn = document.getElementById('sendOtpBtn');
            btn.disabled = true;

            try {
                const res = await fetch('https://audiopool-backend.onrender.com/api/forgot-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email })
                });
                const data = await res.json();
                alert(data.message);

                if (data.success) {
                    startCountdown();
                } else {
                    btn.disabled = false;
                }
            } catch (e) {
                alert("Lỗi kết nối từ máy chủ!");
                btn.disabled = false;
            }
        }

        function startCountdown() {
            countdown = 60;
            const btn = document.getElementById('sendOtpBtn');
            btn.disabled = true;
            btn.innerText = `${countdown}s`;
            if (timerInterval) clearInterval(timerInterval);

            timerInterval = setInterval(() => {
                countdown--;
                btn.innerText = `${countdown}s`;
                if (countdown <= 0) {
                    clearInterval(timerInterval);
                    btn.innerText = "Gửi OTP";
                    btn.disabled = false;
                }
            }, 1000);
        }

        async function handleResetPassword() {
            const email = document.getElementById('resetEmail').value.trim();
            const otp = document.getElementById('resetOtp').value.trim();
            const newPassword = document.getElementById('newPass').value.trim();

            if (!email || !otp || !newPassword) {
                alert("Vui lòng điền đầy đủ thông tin!"); return;
            }

            try {
                const res = await fetch('https://audiopool-backend.onrender.com/api/reset-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, otp, newPassword })
                });
                const data = await res.json();
                alert(data.message);
                if (data.success) window.location.href = 'login.html';
            } catch(e) { alert("Lỗi kết nối từ máy chủ!"); }
        }
    </script>
</body>
</html>
