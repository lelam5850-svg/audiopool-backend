<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AUDIO POOL PRO - Bảng Điều Khiển</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-app: #090d16; --bg-sidebar: #111827; --accent-purple: #8b5cf6; 
            --accent-green: #10b981; --accent-red: #ef4444; --accent-gold: #f59e0b;
            --text-main: #f3f4f6; --text-sec: #9ca3af; --border-sub: rgba(255, 255, 255, 0.08);
        }
        body { margin: 0; background: var(--bg-app); color: var(--text-main); font-family: 'Inter', sans-serif; padding: 20px; display: flex; gap: 20px; }
        
        .column { display: flex; flex-direction: column; gap: 20px; }
        .col-left { width: 320px; }
        .col-right { flex: 1; }

        .box { background: var(--bg-sidebar); border: 1px solid var(--border-sub); border-radius: 12px; padding: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .box-title { font-size: 16px; font-weight: 700; color: var(--accent-purple); margin-bottom: 15px; display: flex; justify-content: space-between; align-items: center; }
        
        .btn { padding: 10px 15px; border: none; border-radius: 8px; cursor: pointer; font-weight: 600; color: #fff; transition: 0.2s; font-size: 13px; }
        .btn:hover { opacity: 0.8; }
        .btn-free { background: #374151; }
        .btn-pro { background: var(--accent-gold); color: #000; }
        .btn-danger { background: var(--accent-red); }
        .btn-success { background: var(--accent-green); }
        .btn-admin { background: #38bdf8; color: #000; }

        .key-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
        .key-item { background: #1f2937; border: 1px solid #374151; border-radius: 8px; height: 60px; display: flex; justify-content: center; align-items: center; font-weight: bold; cursor: pointer; transition: 0.2s; position: relative; }
        .key-item:hover { background: var(--accent-purple); border-color: var(--accent-purple); }

        .badge { padding: 4px 8px; border-radius: 4px; font-size: 11px; font-weight: bold; color: white; }
        .badge-free { background: #6b7280; }
        .badge-pro { background: var(--accent-gold); color: #000; }
        .badge-admin { background: #38bdf8; color: #000; }
    </style>
</head>
<body>

    <div class="column col-left">
        <div class="box">
            <div class="box-title">👤 Thông tin tài khoản</div>
            <p style="margin: 0 0 10px 0;">Xin chào, <b id="usernameDisplay" style="color: var(--accent-green);">...</b></p>
            <p style="margin: 0 0 15px 0;">Gói cước: <span id="packageBadge" class="badge badge-free">FREE</span></p>
            
            <button id="adminBtn" class="btn btn-admin" style="width: 100%; margin-bottom: 8px; display: none;" onclick="window.location.href='admin.html'">🛠️ Mở Trang Admin</button>
            <button class="btn btn-free" style="width: 100%;" onclick="logout()">Đăng xuất</button>
        </div>

        <div class="box">
            <div class="box-title">🎵 Thư viện & Phát nhạc</div>
            <p style="font-size: 13px; color: var(--text-sec);">Tính năng miễn phí cho mọi tài khoản.</p>
            <div style="display: flex; flex-direction: column; gap: 8px;">
                <button class="btn btn-free" onclick="alert('Đang mở thư viện nhạc...')">📂 Mở thư viện nhạc</button>
                <button class="btn btn-success" onclick="alert('▶️ Đang phát nhạc nền...')">▶️ Phát nhạc</button>
            </div>
        </div>

        <div class="box" style="border-color: #374151;">
            <div class="box-title">🗑️ Thùng rác</div>
            <p style="font-size: 13px; color: var(--text-sec);">Quản lý các mục đã xóa.</p>
            <div style="display: flex; gap: 10px;">
                <button class="btn btn-danger" style="flex: 1;" onclick="alert('Đã xóa tệp thành công!')">Xóa</button>
                <button class="btn btn-free" style="flex: 1;" onclick="alert('Đã khôi phục tệp từ thùng rác!')">Khôi phục</button>
            </div>
        </div>
    </div>

    <div class="column col-right">
        <div class="box">
            <div class="box-title">
                <span>🎛️ Bảng Điều Khiển Key</span>
                <div style="display: flex; gap: 10px;">
                    <button class="btn btn-pro" onclick="handleProAction('Thêm Key Mới')">➕ Thêm Key Mới</button>
                    <button class="btn btn-pro" onclick="handleProAction('Đổi Vị Trí Key')">↔️ Đổi Vị Trí</button>
                </div>
            </div>
            
            <p id="subTitleDesc" style="font-size: 13px; color: var(--text-sec); margin-bottom: 20px;">16 Key cơ bản</p>
            
            <div class="key-grid" id="keyGrid"></div>
        </div>
    </div>

    <script>
        const currentUser = JSON.parse(localStorage.getItem('currentUser'));
        if (!currentUser) {
            window.location.href = 'login.html';
        }

        document.getElementById('usernameDisplay').innerText = currentUser.username;
        const badge = document.getElementById('packageBadge');
        const adminBtn = document.getElementById('adminBtn');

        const isFree = !currentUser.package || currentUser.package === 'free';
        const isAdmin = currentUser.role === 'admin';

        if (isAdmin) {
            badge.innerText = 'ADMIN TỔNG 👑';
            badge.className = 'badge badge-admin';
            adminBtn.style.display = 'block';
        } else if (!isFree) {
            badge.innerText = 'PRO VIP 💎';
            badge.className = 'badge badge-pro';
        } else {
            badge.innerText = 'FREE';
            badge.className = 'badge badge-free';
        }

        const keyGrid = document.getElementById('keyGrid');
        for (let i = 1; i <= 16; i++) {
            const keyBtn = document.createElement('div');
            keyBtn.className = 'key-item';
            keyBtn.innerText = `Key ${i}`;
            keyBtn.onclick = () => {
                alert(`Bạn vừa bấm phím: Key ${i}`);
            };
            keyGrid.appendChild(keyBtn);
        }

        // Xử lý phân quyền tính năng Pro
        function handleProAction(actionName) {
            // Nếu là tài khoản Pro hoặc Admin thì cho dùng thoải mái
            if (!isFree || isAdmin) {
                alert(`💎 Đã thực hiện tính năng PRO: ${actionName} thành công!`);
                return;
            }

            // Nếu là tài khoản Thường (Free): Thông báo và chuyển hướng sang Zalo mua bản Pro
            if (confirm(`❌ Tính năng "${actionName}" chỉ dành cho tài khoản PRO.\n\n👉 Bấm [OK] để chuyển hướng đến Zalo mua bản Pro ngay!`)) {
                window.open('http://zaloapp.com/qr/p/1gemukvum5sod', '_blank');
            }
        }

        function logout() {
            localStorage.removeItem('currentUser');
            window.location.href = 'login.html';
        }
    </script>
</body>
</html>
