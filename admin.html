<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Audio Pool Pro - Trang Quản Trị Admin</title>
    <style>
        body { font-family: Arial, sans-serif; background: #0f172a; color: white; margin: 0; padding: 30px; }
        .container { max-width: 900px; margin: auto; background: #1e293b; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        h2 { color: #f59e0b; margin-top: 0; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; background: #0f172a; border-radius: 8px; overflow: hidden; }
        th, td { padding: 12px 15px; text-align: left; border-bottom: 1px solid #334155; }
        th { background: #1e293b; color: #38bdf8; }
        .btn { padding: 6px 12px; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 12px; }
        .btn-activate { background: #10b981; color: white; }
        .badge { padding: 4px 8px; border-radius: 4px; font-size: 11px; font-weight: bold; }
        .badge-free { background: #64748b; color: white; }
        .badge-pro { background: #f59e0b; color: black; }
        .badge-admin { background: #38bdf8; color: black; }
    </style>
</head>
<body>

<div class="container">
    <div style="display: flex; justify-content: space-between; align-items: center;">
        <h2>🛠️ Quản Trị Viên - Kích Hoạt Tài Khoản Pro Từ Xa</h2>
        <div>
            <button class="btn" style="background: #3b82f6; color: white; margin-right: 10px;" onclick="window.location.href='dashboard.html'">Vào Trang Chính</button>
            <button class="btn" style="background: #ef4444; color: white;" onclick="logout()">Đăng Xuất</button>
        </div>
    </div>
    <p style="color: #94a3b8;">Danh sách tài khoản và khách hàng đã đăng ký trên hệ thống:</p>

    <table>
        <thead>
            <tr>
                <th>Tên Đăng Nhập</th>
                <th>Email</th>
                <th>Gói Cước / Vai Trô</th>
                <th>Thao Tác Kích Hoạt Từ Xa</th>
            </tr>
        </thead>
        <tbody id="userTableBody">
            <tr><td colspan="4" style="text-align: center; color: #94a3b8;">Đang kết nối tải dữ liệu...</td></tr>
        </tbody>
    </table>
</div>

<script>
    const currentUser = JSON.parse(localStorage.getItem('currentUser'));
    if (!currentUser || currentUser.role !== 'admin') {
        alert('Bạn không có quyền truy cập trang này!');
        window.location.href = 'login.html';
    }

    async function loadUsersList() {
        try {
            const res = await fetch('https://audiopool-backend.onrender.com/api/admin/users');
            const data = await res.json();
            
            const tbody = document.getElementById('userTableBody');
            tbody.innerHTML = '';

            if (data.success && data.users && data.users.length > 0) {
                data.users.forEach(user => {
                    const tr = document.createElement('tr');
                    const isAdmin = user.role === 'admin';
                    const isPro = user.package && user.package !== 'free';
                    
                    let badgeHTML = isAdmin ? '<span class="badge badge-admin">ADMIN 👑</span>' : (isPro ? '<span class="badge badge-pro">PRO VIP 💎</span>' : '<span class="badge badge-free">FREE</span>');
                    let actionHTML = isAdmin ? '<span style="color: #38bdf8; font-weight: bold;">Quản trị tối cao</span>' : (isPro ? '<span style="color: #10b981; font-weight: bold;">Đã là Pro</span>' : `<button class="btn btn-activate" onclick="upgradeUser('${user.username}')">⚡ Kích Hoạt Pro</button>`);

                    tr.innerHTML = `
                        <td><b>${user.username}</b></td>
                        <td>${user.email}</td>
                        <td>${badgeHTML}</td>
                        <td>${actionHTML}</td>
                    `;
                    tbody.appendChild(tr);
                });
            } else {
                tbody.innerHTML = `<tr><td colspan="4" style="text-align: center; color: #94a3b8;">Chưa có tài khoản nào đăng ký.</td></tr>`;
            }
        } catch (e) {
            document.getElementById('userTableBody').innerHTML = `<tr><td colspan="4" style="text-align: center; color: #ef4444;">Lỗi kết nối máy chủ backend!</td></tr>`;
        }
    }

    async function upgradeUser(username) {
        if (!confirm(`Bạn có chắc muốn kích hoạt tài khoản "${username}" lên bản Pro vĩnh viễn không?`)) return;

        try {
            const res = await fetch('https://audiopool-backend.onrender.com/api/admin/upgrade-pro', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username })
            });
            const data = await res.json();
            alert(data.message);
            loadUsersList();
        } catch (e) {
            alert('Lỗi kết nối máy chủ!');
        }
    }

    function logout() {
        localStorage.removeItem('currentUser');
        window.location.href = 'login.html';
    }

    loadUsersList();
</script>

</body>
</html>
